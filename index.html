  <script>
    const EPISODES = [{"date": "2026-10-28", "title": "10/28 早间简报：Claude Duet 主动干活 AI、Ego Lite 与 lemo-opuscar 开源、出海先收钱再写后端", "summary": "先从第一块热闻说起。过去这二十四个小时，圈里最吵的不是又一个跑分榜，而是 Anthropic 把「主动干活的 AI」真的做成产品了。它叫 Claude Duet，读作 Claude Duet。它不是你问一句它答一句的聊天窗，而是会自己盯你连上的邮箱、日历和业务应用，早上先给你一份优先事项简报，然后在后台继续干活，只有需要你拍板的时候才来打断你。敏感操作比如发邮件、付钱、删东西，它会先问你。眼下还是研究预览，主要开放给美国地区的 C...", "audioUrl": "https://ssy1oo.github.io/smith-briefing-podcast/2026-10-28.mp3", "durationStr": "09:34", "durationSec": 574, "sizeMB": "4.4 MB", "paragraphs": ["早安 Smith，今天是十月二十八号星期三。不管你在开车还是走路，都可以只带一只耳朵听。咱们继续早间通勤语音简报，还是四块内容：科技和 AI 热闻、关注博主挖到的开源项目、赚钱副业拆解，以及「利用…」类的实战玩法。全程口语化，没有链接和编号列表。", "先从第一块热闻说起。过去这二十四个小时，圈里最吵的不是又一个跑分榜，而是 Anthropic 把「主动干活的 AI」真的做成产品了。它叫 Claude Duet，读作 Claude Duet。它不是你问一句它答一句的聊天窗，而是会自己盯你连上的邮箱、日历和业务应用，早上先给你一份优先事项简报，然后在后台继续干活，只有需要你拍板的时候才来打断你。敏感操作比如发邮件、付钱、删东西，它会先问你。眼下还是研究预览，主要开放给美国地区的 Claude Pro 和 Max 订阅用户，要排队候补，而且单独一个 App，还不能在桌面端完整嵌进主 Claude。对你这种每天只有两三小时碎片时间、又要同时推公司商城和副业的人来说，方向很清楚：下一轮竞争的重点，已经从「模型聪不聪明」，变成「它能不能在你不盯着的时候把活往前推」。", "同一家公司这两天还连放了好几枪。一是对外公开了一篇论文，署名只有 Claude，没有真人作者，内容是它在内部跑了大约一千四百万个词元之后，自己摸出了一种处理三维可满足性问题的更快算法，等于在挑战理论计算机科学里一个很硬的假设。圈里因此整天喊 Fable 五点五要来了，不过官方还没官宣新模型。二是它自己发了一套免费 GitHub 资料，核心观点特别狠：多数时候，一个聪明的单体智能体，比一堆互相交接的多智能体更省钱、更稳；先把单体跑通、测清楚，再考虑要不要拆子智能体。三是生命科学团队官宣，已经和包括百时美施贵宝在内的六家生物医药团队，在真实药物研发项目里用 Claude，覆盖靶点筛选、分子设计、法规文书和试验流程。四是它还发了一项内部研究：五十名专业分析师在用 Claude Code 做因果推断任务时，模型被偷偷塞了随机倾向，结果分析师有百分之八十六的判断跟模型站一边，还经常把模型的论证当成自己的。这个点特别值得你记住：团队里用 AI 写方案、做外包评估的时候，人很容易不知不觉把判断权交出去。", "模型战场这边，OpenAI 继续扩企业入口，宣布加深和甲骨文的合作，以后甲骨文的应用和数据可以直接进 ChatGPT，甲骨文也会在自己的市场里卖 OpenAI 的接口、Codex 和 ChatGPT Work。DeepMind 的 Logan Kilpatrick 则在推特上预告，Genie 四号世界模型很快会进 API，第一次让开发者能直接调这种「能理解物理场景」的模型。端侧这边，Liquid AI 放出了大约二十亿参数量级的 LFM 三系列，同一套骨干同时做文本、视觉、音频和全能智能体，号称比上一代更小更强，适合单卡微调后塞进边缘设备。产品工具上，Replit 说它的云端智能体已经能跑任意代码库，并直接在界面里开出拉取请求；Cursor 给设计模式加了 Annotate，可以在页面上圈画、改元素，再让智能体按视觉提示改；GitHub Copilot 开放了面向组织安装应用的服务端到服务端鉴权预览，方便你把自家机器人接到 Copilot，而不用假装成某个真人登录。", "聊完热闻，进入第二块：开源项目。今天我挑三个跟你手头事最贴的。", "第一个，来自你盯梢名单里的陈大黄。他这两天把主力浏览器换成了 Ego Lite，并系统梳理了市面上八条 AI 浏览器自动化路线。Ego Lite 的名字再念一遍，Ego Lite。它不是普通套壳，而是按智能体的运行方式改过浏览器：可以无缝导入原有浏览器账号，多套个人资料互不影响，还特别适合让智能体自己点网页、抓数据。陈大黄实测用它登录后，把口播博主的视频批量导出、转成逐字稿，再丢进知识库，全程几乎不用手；用在小红书做竞品和热帖调研也很顺。不过要注意两点：一是它目前并没有把浏览器内核完全开源，开源的主要是智能体控制层；二是让智能体开太多资料档，小红书可能触发设备过多验证。他顺带挖到一个更彻底开源的替代叫 Browser OS Neo，连内核都开源，他说有空会再深挖。对你来说，公司要做腾讯广告素材自动化、豆芽声波要盯小红书起号，这种「浏览器被智能体当手用」的工具，比单纯聊天模型更接近落地。", "第二个项目，是这两天中文圈反复被安利的 lemo-opuscar，GitHub 仓库在 lemomo-ai 下面，星标已经冲到六千多，名字再重复一次，lemo-opuscar。它不是调用视频大模型，而是给 Claude Code 装一套「用代码拍电影」的技能：五十多种现成影片风格，每种都有风格提示词和完全用代码渲出来的示范短片，也能自定义风格。适合知识科普、历史讲解、产品概念片这类日更账号。坑是它为 Opus 五点五调校，一条片子可能跑很久，建议先出十五秒样片定风格再批量。你这周如果要给豆芽声波做视频号演示，或者给腾讯广告试做图解口播，可以拿它打样，省掉大量手工剪辑。", "第三个项目，是百度文心刚开源的 Unlimited OCR 二，再念一遍，Unlimited OCR 二。它的卖点不是「上下文窗口越大越好」，而是每一步只看该看的局部，用稀疏注意力把显存从大约四十七吉字节压到一点七七吉字节，长文档识别准确率据说比通用大模型高两倍多。对你后面要做的微信 ID 批量采集、门店物料和合同扫描归档，本地便宜跑长图长 PDF，会比动辄烧云端多模态更划算。", "第三块，赚钱副业。这两天独立开发出海圈有一个共识被反复强调，我把它总结成一句话：先证明有人付钱，再写后端。具体怎么做呢？有人建议顺序倒过来：先做一页落地页，挂上 Stripe 或 Lemon 的支付链接；找五个潜在买家私信或发帖，看有没有人真掏卡；有人付钱了再补功能，没人付就换题，别硬扛。收款路径也有人拆得很清楚：刚起步没公司，可以先走代收代缴平台，税和退款它兜着，手续费贵两三个点也认；月流水稳定过几千刀，再注册海外主体、开自己的收款账户；上线前就把退款政策页和客服邮箱挂好，拒付率压在百分之一以内。还有一个冷提醒：别再指望靠「卖模型套壳接入点」赚钱，顶尖模型价格腰斩之后，客户只会为能解决具体工作流痛点的垂直结果买单。这跟你做海外小游戏、做豆芽声波是同一条逻辑：卖结果，不卖接口差价。", "Miles 昨天还提了一个小实操：没时间开港卡、但又要领创作者收益时，可以走 Wise 一类路径先把钱接到手。细节因人而异，你真要做平台分成时再核对最新规则就好。", "第四块，「利用…」类分享。按你清单里的备注，这个板块的具体范围你还没最终拍板，我今天先继续用「利用现成 AI 工作流把效率拉满」这个口径，讲三个昨天到今天最能直接抄作业的玩法。", "第一个，利用 Agent 专用浏览器做「人不在场的调研流水线」。陈大黄的玩法就是：把目标博主或关键词交给智能体，让它在 Ego Lite 里自己搜、自己下视频、自己转写、自己归档。你要盯的是规则和风控，比如别让它狂开资料档，而不是自己点鼠标。豆芽声波起号前的竞品笔记拆解，完全可以按这条流水线周更一次。", "第二个，利用 Anthropic 自己总结的「先单体、后分身」原则搭工作流。很多人一上来就上多智能体编排，结果交接丢上下文、费用翻倍。更稳的做法是：先让一个智能体把商城外包评估、投放素材脚本或小红书笔记从头到尾跑通，量化时间和差错，再决定哪一步值得拆成子智能体并行。这正好能迁到你规划的腾讯广告素材自动生成系统：先一条流水线打通文案、选材、剪辑、配音，再拆并行。", "第三个，利用云端编码智能体让非工程同事也能交拉取请求。Replit 说设计团队半年用云端智能体往公司库里合了超过二十五万行代码，工程师只负责最后审核。你公司如果要把商城缺陷清单、门店反馈快速变成可评审的改动，不必人人会配本地环境，关键是权限、测试和人工合并门禁要先设好。", "四个板块就到这儿。最后半分钟对一下你今天的优先级：工作上，商城外包评估材料发给粉象方山、以及投放工具的价格和合同，仍然是本周 P1；副业上，豆芽声波分享卡片的图和标题，抽一小时检查一下就很值。今天这期简报的文字稿和音频，我已经存进秘书目录的 briefings 文件夹，文件名带今天的日期十月二十八。路上听着要是哪段想展开，回头跟我说一声就行。祝你通勤顺畅，今天把方山那边的关键一步往前推！"]}, {"date": "2026-10-27", "title": "10/27 早间简报：Anthropic 冲刺 IPO 人均创收 660 万刀、GPT-6.1 Terra 降价狙击、VoiceStudio 与 21 天出海出单", "summary": "今天这十几分钟的通勤路，咱们一共聊四块内容。第一块是昨天和今天凌晨，海内外科技圈和 AI 圈最重磅的三件大事，尤其是大模型巨头上市披露出来的惊人赚钱效率，还有新一轮模型价格战背后的风向变化。第二块是你平时在推特上关注的陈大黄、冰河、高谦这几位博主，刚刚挖出来的几个特别好用的 GitHub 开源项目，我会挨个跟你说清楚每个项目叫什么、是干嘛的、解决什么痛点，以及咱们自己做业务能不能直接拿来用。第三块是这两天推特上跑出来的三个真实赚钱...", "audioUrl": "https://ssy1oo.github.io/smith-briefing-podcast/2026-10-27.mp3", "durationStr": "28:12", "durationSec": 1692, "sizeMB": "12.9 MB", "paragraphs": ["早安 Smith，今天是十月二十七号星期二。不管你现在是在开车还是在走路，都可以放轻松，只带一只耳朵听我跟你聊聊过去这二十四个小时里，科技圈和 AI 圈真正值得你花心思关注的几件事。今天是咱们早间通勤语音简报的第一期，我完全按照适合路上听的方式给你准备，没有任何链接、表格或者冷冰冰的编号列表，咱们就像两个平时经常聊技术和生意的朋辈一样，边走边聊。", "今天这十几分钟的通勤路，咱们一共聊四块内容。第一块是昨天和今天凌晨，海内外科技圈和 AI 圈最重磅的三件大事，尤其是大模型巨头上市披露出来的惊人赚钱效率，还有新一轮模型价格战背后的风向变化。第二块是你平时在推特上关注的陈大黄、冰河、高谦这几位博主，刚刚挖出来的几个特别好用的 GitHub 开源项目，我会挨个跟你说清楚每个项目叫什么、是干嘛的、解决什么痛点，以及咱们自己做业务能不能直接拿来用。第三块是这两天推特上跑出来的三个真实赚钱副业拆解，看看别人到底是怎么在二十一天内做出海网站出单、怎么靠家庭微服加一部折叠屏手机一个月外包赚上万块的。最后第四块，咱们聊聊大家是怎么「利用」现成的 AI 工作流去把效率拉满的。", "好，咱们先从第一块，也就是昨天到今天凌晨科技圈最炸裂的大新闻聊起。如果说昨天整个硅谷和华尔街都在刷屏同一件事，那就是 Claude 背后的母公司 Anthropic，正式向美国证监会递交了纳斯达克上市申请，有望在十一月中旬敲钟，成为人类历史上规模最大的科技股 IPO 之一。特别逗的是，它选的股票代码叫 A、N、T，就是英文里蚂蚁的那个词 ANT。你平时在推特上关注的刘小排昨天看到这个消息就忍不住调侃了一句，说蚂蚁集团的英文名本来就叫 Ant Group，这下代码被抢注，蚂蚁难道彻底断了去美股上市的念想吗？", "玩笑归玩笑，这份招股书真正让人后背发凉的，是它第一次向全世界摊牌的赚钱能力和吞金规模。先说赚钱能力，三年前这家公司的年收入才四千一百万美元，结果到了今年上半年，它的半年营收直接冲到了老天爷都不敢信的一百六十三亿美元，光是今年二季度一个季度就收了一百一十五点五亿美元，同比暴涨了十三倍还多，而且第一次实现了单季度近十亿美元的经营利润，老客户的净收入留存率接近百分之九百。你关注的博主花叔昨天专门从招股书里扒出了一个最恐怖的指标：Anthropic 的员工人均给公司带来的年收入，高达六百六十万美元。我再重复一遍这个数字，人均年创收六百六十万美元，比现在的英伟达和苹果还要高出一截。如果拿咱们国内已经上市或者准备上市的大模型公司做个对比，根据昨天虎嗅引用的最新研究数据，Anthropic 的毛利率能做到百分之六十五左右，而智谱的毛利率大约是百分之二十六，MiniMax 大约只有百分之十八，这也是为什么最近 MiniMax 股价破发、智谱回调那么深，因为中美大模型眼下最大的差距还真不是技术跑分，而是海外企业客户愿意为高生产力工具付高溢价的市场结构。", "不过，赚得多，花得更狠。招股书显示 Anthropic 账上虽然躺着一千三百二十亿美元的现金，比很多老牌科技巨头都阔绰，但它签下的未来算力总承诺高达七千八百亿到八千一百亿美元，而且在招股书里坦言数据中心高度依赖天然气发电，甚至要自己架燃气轮机。就在昨天一天之内，华尔街为了喂饱这些 AI 巨头的算力胃口，同时推进了三笔超级融资，高盛一家投行一天就经手了超过两千一百亿美元的交易。哪三笔呢？第一笔是美国银行、黑石、花旗和摩根士丹利联手，通过一个特殊目的实体给 Anthropic 提供了六百三十亿美元的融资，专门用来买博通的 AI 芯片再租给它用；第二笔是 Meta 宣布启动最高九百五十亿美元的股权融资去扩建数据中心，连英伟达、AMD 和博通都打算凑五十亿美元去认购它的股票；第三笔是马斯克的 SpaceX 刚刚跟阿波罗和高盛签了四百亿美元的英伟达下一代芯片租赁协议，用来支持它旗下的 xAI。你看，另一头微软昨天为了腾出钱来砸 AI 算力，甚至开始向美国、英国、加拿大和印度的六万名员工提供自愿离职买断补偿。整个硅谷现在就是一句话：勒紧裤腰带、加满金融杠杆，把所有的筹码都推上牌桌。", "聊完资本牌桌，咱们再看看今天凌晨模型圈里跟咱们每天干活息息相关的第二件大事。今天凌晨，OpenAI 正式发布了最新模型，名字叫 GPT-6.1 Terra，注意后面这个词叫 Terra。这个模型最有意思的地方在于，它不跟你卷那些虚头巴脑的奥数题了，而是专门针对电脑操作、看图理解和跨应用办公自动化，而且一上来就把标准 API 的价格比上一代砍了一半，降到了每百万输入一美元、输出五美元。在权威的独立评测里，用 GPT-6.1 Terra 跑完一个复杂智能体任务的平均花费，直接从上一代的一块四美金降到了四毛美金，整整省了三分之二，而且遇到不懂的问题胡思乱想瞎猜的比例，也从百分之八十八大幅降到了百分之三十八。", "很多推特上的开发者今天凌晨看完评测图，一下子就看明白 OpenAI 的算盘了：GPT-6.1 Terra 根本不是为了去取代目前写代码最强的 Claude Opus 5.5，而是精准地卡在了一个极具杀伤力的身位上，专门去狙击中国的开源模型梯队。在综合智能指数上，它拿到了四十八分，刚好压在千问、DeepSeek、智谱和 MiniMax 一众国产模型头顶上，只比月之暗面刚发的 Kimi K3.1 Pro 略低一点。", "说到月之暗面的 Kimi K3.1 Pro 和 DeepSeek，这两天国内模型圈的口碑可以说是冰火两重天，特别值得咱们做产品的人琢磨。Kimi K3.1 Pro 虽然是个两万八千亿总参数的巨无霸，跑分冲到了全球第四，结果上线才四十八个小时，昨天凌晨官方就不得不发公告向全体订阅用户致歉，给所有会员一次性补偿百分之二十五的月度额度。为什么翻车呢？因为很多用户拿它跑智能体任务的时候发现，它在后台会疯狂拉起子智能体、输出巨长无比的废话，有个买了一百九十九元月卡的用户吐槽说，自己只是装了一个技能，短短一会儿就把五个小时限额的百分之七十给烧光了。连你关注的冰河昨天都专门发推吐槽说，Kimi 现在根本不是服务大众的模型，看着单价下调了，但真拿来做项目算总账，居然比用 Claude 还要贵。", "反过来，全网这几天一边用一边夸的，是 DeepSeek 刚刚升级的 V4.1 Flash 一零一七版本。再提一次这个版本号，DeepSeek V4.1 Flash 一零一七。它不光在网页开发竞技场里拿下了开源模型全球第一，把单次任务成本砍到了几毛钱，而且它的键值对缓存压缩得极其恐怖，错峰调用每百万输入只要一毛五美金、输出六毛美金，缓存命中甚至低到千分之三美金。你关注的懒猫微服创始人 Andy 昨天晚上还在推特上晒成绩单，说他又研究了一套新的推理方案，把 DeepSeek 一零一七版本的单流输出速度推到了极限，做到了每秒七十五点六七个词元。这一正一反两个例子其实给我们提了个醒：现在选模型做业务，不能光看发布会的跑分，更不能光看表面上的单价，谁的输出精炼、不瞎调子代理、缓存便宜，谁才是真正能帮咱们省钱干活的好马。", "顺着国内动态，再简单提两件跟内容和硬件有关的新鲜事。一件是字节跳动的火山引擎刚刚拿真金白银推出了 Seedance 精品 AI 剧激励计划，只收纯 AI 生成的漫剧和仿真人剧，真人实拍的一概不要，按照在红果短剧上的月度热度排名发奖金，前十名每部剧直接奖励二十万元，一半给现金、一半给火山方舟的算力券，明摆着是用补贴把 AI 短剧创作者死死绑在字节自己的工具链和分发平台上。另一件是端侧硬件，苹果昨天发布了第八代 iPad mini，换上了八点五英寸的 OLED 屏幕和 A20 Pro 芯片，五千四百九十九元起售；而小米昨天则悄悄发了一个非常有极客精神的开源小硬件，叫 HachimoDock，自制物料成本只要一百五十块钱左右，放在电脑桌面上既是个会互动的 AI 桌宠，又能当桌面智能体的语音中控，你动动嘴就能让它给电脑上的编程智能体派活，还能顺手联动家里的小米智能家居。", "聊完了大厂的新闻，咱们自然过渡到今天的第二个板块，来看看你平时在推特上关注的几位技术大V和独立开发者，昨天和今天都分享了哪些值得放进工具箱的 GitHub 开源项目。我挑了四个最实在、跟咱们平时工作和副业最贴近的项目，每个都给你讲清楚它叫什么、做什么的、解决什么痛点、以及咱们能怎么用。", "第一个项目，是你关注的副业拆解博主冰河昨天重点推荐的，名字叫 VoiceStudio，也就是英文里声音工作室连起来写，VoiceStudio。这个项目在 GitHub 上已经狂揽了八万七千八百多个星标，涨势极其猛。它是做什么的呢？它是一个完全在本地电脑上运行、不需要注册登录、而且完全免费的开源全能语音工作站，把文字转语音、视频配音、语音转文字、还有有声书制作全都装进了一个软件里，同时兼容六百多种语言。它解决的核心痛点是什么？就是咱们平时做短视频配音或者做音频产品的时候，如果用商业平台的接口，不仅按字数算钱越用越肉疼，而且很多平台对音色克隆和批量导出限制特别多。那这个 VoiceStudio 对咱们有什么实际用处呢？你想啊，一方面你公司接下来要做腾讯广告素材的自动生成系统，第四步就是自动配音和剪辑，用这种本地免费工具就能零成本批量跑口播音轨；另一方面，你正在运营的「豆芽声波」小程序主打的就是哄睡故事和声音生成，平时在小红书和视频号发演示内容、或者测试多语种故事效果时，完全可以用 VoiceStudio 在本地快速打样，一分钱接口费都不用花。", "接着看第二个项目，是你盯梢列表里的独立开发者陈大黄今天早上刚刚挖出来的，名字叫 douban-cli，也就是豆瓣的拼音加上命令行工具的缩写 cli，再念一遍，douban-cli。这个项目是做什么的呢？有位极客开发者把豆瓣读书和豆瓣电影的接口，直接封装成了一套可以在终端里运行的命令行工具。它解决什么问题呢？以前咱们想找部高分电影周末看，或者想把看过的书同步一下笔记，得自己打开豆瓣网页去搜、去翻评论，AI 助手很难直接插手，因为豆瓣的网页反爬和交互对智能体并不友好。把它变成命令行工具之后，最大的实际用处就来了：你可以直接把这套命令行交给你的 AI 智能体去调用，比如直接跟 AI 说，去豆瓣前二百五十名榜单里帮我挑三部节奏快、适合全家看的电影，或者让 AI 直接帮你给刚看完的书打分、写短评，甚至一键同步到微信读书里。陈大黄今天早上发完这个项目之后紧接着又发了一条感慨，说根据最新的智能体工具调用排行榜，现在全网智能体调用次数最多的前五名工具，清一色全是网页抓取和社交媒体数据接口，排第二的 TikHub 已经被调用了五十多万次。这也说明，谁能把封闭平台的数据封装成 AI 随手能调的命令行或者技能，谁就抓住了智能体时代的刚需铲子。", "紧接着第三个项目，同样来自陈大黄这两天的分享，项目名字非常直白，叫 html-to-video，也就是把 HTML 网页直接转成视频的开源工具，再重复一次名字，html-to-video。它是做什么的呢？它允许你通过大模型写出来的网页代码，直接生成带有丝滑镜头推拉、分镜切换、文字动效和转场的产品演示视频或者技术图解短片。它解决的是什么问题呢？很多独立开发者和做业务的人，代码写得飞快，产品几天就做出来了，但一到要做宣传视频、发视频号或者小红书的时候就卡壳，因为打开剪映或者专业后期软件去一帧一帧调关键帧、做排版动画，实在太耗费精力了。这个 html-to-video 的实际用处就在于，现在大模型写前端动效网页非常拿手，你只需要用自然语言告诉 AI 你想要什么样的分镜、文案和转场节奏，让它生成网页，再通过这个工具直接导出成高清演示视频。像你这周计划给「豆芽声波」做两条视频号演示视频，或者平时给团队做 AI 培训微课的片头图解，都可以用这个路子来省掉繁琐的手工剪辑。", "第四个项目，是你盯梢列表里的博主「AI 搞钱 Hacker」高谦昨天专门点赞讨论的一个智能体记忆开源项目，名字叫 EverOS，永恒操作系统的意思，EverOS。它是做什么的呢？它是专门给大模型和智能体打造的一套结构化长期记忆系统。它解决的痛点，咱们每个人每天用 AI 都深有体会，就是大模型的「金鱼记忆」——比如你改了十几轮才定下来的小红书笔记写作规范、开头必须用什么句式、封面标题怎么起、结尾怎么引导加群，只要你关掉当前聊天窗口、新开一个对话，AI 就忘得一干二净，你又得重新把长长的规范复制粘贴喂给它。EverOS 是怎么解决的呢？它不只是简单地把聊天记录塞进向量数据库，而是会自动把你的日常对话切分成一个个事件片段，再聚合成具体的工作场景，最后最厉害的一步，是它能从你重复做的案例里，自动蒸馏提炼出一套可复用的技能文件。它的实际用处就是，你把平时写投放文案、写小红书笔记或者整理商城需求的对话丢进去，用上几次之后，它自己就能帮你总结出一套专属的标准作业程序，以后新开任务直接调用，再也不用当人肉复读机了。", "除了这几位你关注的博主直接分享的四个项目之外，我还顺手帮你留意了一个跟赫兹今天早上的出海复盘紧密相关的热门开源项目，名字叫 new-term-radar，也就是新词雷达。它能每天自动扫描推特、Hugging Face 和 GitHub，在某个 AI 新词还没进入谷歌趋势和传统关键词工具之前就把它抓出来，自动算好搜索量和首页竞争难度，十四天后还会自己复盘当初判断准不准，一个月运行成本只要十五美元左右。", "聊到这个新词雷达，咱们就顺理成章地进到今天的第三个板块：赚钱副业分享。这两天在推特中文圈，有三个实打实跑通了变现闭环的副业案例特别火，咱们不聊虚头巴脑的鸡汤，直接拆解它们到底是什么副业、具体怎么做、赚不赚钱以及成本和避坑要点。", "第一个副业，就是刚才提到的「抢注海外 AI 新词做轻量网站出海」。这是你盯梢的出海站长赫兹今天早上刚刚转发互动的一个真实案例。有位新手博主昨天深夜发帖报喜，说自己十月五号才人生第一次听说网站出海，结果到十月二十六号就正式出单收钱了，前后加起来总共才用了二十一天。再强调一下这个速度，从零听说到海外收款出单，只用了二十一天。这门副业具体是怎么做的呢？核心就四个字：抢做新词。当海外刚冒出一个新的大模型、新的开源工具或者新的热门玩法时，老牌大网站还没来得及做专题页，全世界的用户却已经开始去谷歌和 AI 搜索引擎里搜这个词了。这时候你通过看哥飞、赫兹这些出海博主的复盘，或者用刚才说的雷达工具抓到这个新词，立刻用 Cursor 或 Claude 快速生成一个专门围绕这个新词的工具站或落地页，把核心关键词布局好，挂上 Stripe 收款链接。那它赚不赚钱、有什么成本和防坑要点呢？投入成本极低，基本就是一个几十块钱的域名加免费的云托管，毛利率都在百分之八十以上。但赫兹昨天在推特上专门给做这行的人提了两个极其关键的实操保命技巧：第一个技巧是，网站一定要做服务端渲染，也就是常说的 SSR，因为现在 OpenAI 等大模型的搜索爬虫很可能不执行网页里的前端脚本，如果你不做服务端渲染，AI 搜索引擎就抓不到你的内容，等于白白丢掉一大半精准流量；第二个技巧是防盗刷，赫兹说这几天经常遇到黑产拿盗刷的信用卡在网站上测试付款，特征是付完钱之后完全不用你的产品，而且付款时换了好几张卡才成功，遇到这种订单千万别贪，立刻在后台把这个用户封禁，主动在 Stripe 里点原路退款并拉入黑名单，否则等持卡人发起拒付争议，不仅钱要退回去，每一笔还要倒赔十五美元的争议罚款，严重了甚至会封收款号。", "接着看第二个副业案例，来自你关注的懒猫微服创始人 Andy 昨晚转发的一篇长文，我愿称之为「下班后的行走独立开发外包」。这是什么副业呢？是一位在武汉工作的 C++ 程序员，利用家里的微服服务器加上一部折叠屏手机，在业余时间做一对一求职带教和熟人圈的垂直算法小外包，一个月净赚上万块。他具体是怎么一步步跑通的呢？这里面最精彩的其实是他的试错过程。他最开始也犯了技术人员最容易犯的毛病：自己闭门造车，构思了一套面向课外培训机构的 AI 软件加硬件系统，然后趁着周末骑着小电动车，跑遍了武汉各个小学附近的十七八家课外辅导机构去陌拜推销。结果呢？整整十七八家机构，没有一家愿意搭理他，不仅周末全搭进去了，连电动车的轮胎都跑废了一条。碰壁之后他立刻醒悟了：副业想快速见到回头钱，绝对不能去啃没有信任基础的陌生线下门店，而是要盘点自己手里现成的筹码。他以前缺钱时干过两年课外辅导，很懂怎么跟学生和家长沟通，自己又懂编程和视觉算法。于是他立刻干了两件事：第一件事是给想找工作的学弟做一对一的软件开发就业实战辅导，他先花了整整两天时间，精心设计了一节免费的腾讯会议干货体验课，把节奏拉满，一节课讲完学弟当场买单，第一单就收了三千二百八十八块钱，他直接用自己家里的服务器给学弟搭好代码仓库和任务清单，带着学弟一个月就拿下了工作。第二件事是回头联系了一位以前面试认识、说过「有想法随时来找我」的武汉本地老板，接下了一个手写字符识别的视觉算法外包，合同总价一万六千元。最酷的是他的干活方式：他买了一台折叠屏手机，通过内网穿透直连家里的服务器，哪怕国庆中秋回老家连笔记本电脑都不带，在折叠屏手机上左边屏幕看算法识别图片的效果，右边屏幕直接用语音使唤服务器上的 Codex 改代码调参数，硬是靠一部手机把第一期交付做完，稳稳拿到了第一笔一万元首款。你看，一万块外包首款加上三千多块的咨询费，一个月一万三千多块到手，不仅把买硬件和烧 Token 的钱全赚回来了，还彻底跑通了不坐班的副业模型。", "再看第三个副业方向，是昨天在推特上引起不少讨论的「海外 AI 实用案例搬运加小红书小工具变现」。这是什么副业呢？就是针对国内大量想用 AI 又看不懂英文、不知道怎么落地的普通人群，做小红书垂类教程号和挂载小程序、小工具。具体怎么做呢？每天固定抽出半小时到一小时，去英文推特和 Reddit 社区里，不看那些深奥的论文，只挑十个普通人一看就懂、一用就爽的 AI 实用小案例，比如怎么把旅行随手拍的照片一键改成宫崎骏插画、怎么用 AI 给孩子生成专属睡前故事、怎么用 AI 自动做周报表格，自己亲手实测跑通之后，截好图写成大白话的中文步骤发到小红书。同时，昨天有敏感的开发者发现，小红书的小工具现在已经支持接入 AI 聊天能力，后续还能直接在小工具里加广告位，等于是在小红书内部复刻了一遍当年微信小程序的流量红利。至于赚不赚钱，按这套打法坚持发满三个月积累起精准粉丝后，通过工具推广分成、接商单以及挂载自己的付费小工具，很多单兵作战的人都能做到月入一万以上。这个路子其实跟你正在推进的「豆芽声波」小红书起号完全可以打配合，一边发宝妈哄睡的实用场景笔记，一边承接搜索流量。", "好，聊完了这三个赚钱副业，咱们进入今天简报的第四个板块，也就是「利用…」类的分享。在正式聊案例之前，我按要求先把这句话清清楚楚地记在这里，也念给你听：", "（注：利用类：待 Smith 确认具体范围）", "因为这个板块是今天刚加进来的，我还不确定你最想听的是「利用 AI 工具搭自动化工作流」、「利用平台规则搞免费流量」、还是「利用信息差做跨平台套利」，所以我今天先从昨天和今天推特上最火的实战帖里，给你精选了三个最有启发性的「利用…」玩法。你听完之后随时跟我说一声，咱们明天就把这个板块的口径彻底锁定下来。", "今天要聊的第一个利用玩法，是「利用无代码自动化画布，一个人同时运转七个不露脸的 YouTube 频道外加一套预测市场套利系统」。这是昨天在推特上被疯狂转发的一个二十四岁年轻人的真实工作流。他是怎么利用这套工具的呢？他没有像传统自媒体那样招一堆编导和剪辑，而是在一张可视化的无代码画布上，串联了几百个自动化节点。最前面的节点负责每天二十四小时盯着全网数据，自动挖掘热度正在抬头的新选题；中间的节点接力棒一样，自动写好视频脚本、自动调用语音模型配音、自动匹配画面完成剪辑、再自动生成吸引眼球的封面图和标题；最后的节点直接把成品视频塞进七个不同细分频道的发布队列里。整套系统只需要搭建一次，七个不露脸的频道每天就能全自动产出十八条视频，光靠这七个频道每月就能给他带来三万八千美元的收入，再重复一遍，每个月三万八千美元。而且他还没停手，他把同一套信息扫描和判断节点的逻辑，直接接到了像 Polymarket 这样的预测市场上，专门利用信息时间差去捕捉体育赛事的赔率偏差。他自己每天真正干的活，不再是埋头剪片子，而是像个基金经理一样坐在屏幕前，看哪个频道的留存率高就保留哪个模板，哪个创意数据差就砍掉哪个节点。", "第二个利用玩法，跟视频生产直接相关，叫「利用本地开源模型配合代码技能，一句话生成商业级宣传短片和连续短剧」。昨天推特上有两个实操贴特别亮眼：一位创作者分享了他怎么利用刚刚登顶国内图生视频榜首的 MiniMax H3 模型，用大模型写好分镜提示词后，直接对接本地电脑上的 ComfyUI 工作流，连续生成人物和光影保持一致的视频片段，自己在本地就剪出了一部颇具质感的 AI 短剧；另一位开发者则是利用了一个名叫 video-shotcraft 的开源技能，直接把豆包官网的真实网页丢给 Codex，只说了一句话，就让 AI 通过写代码控制镜头运动、转场、文字动画和音效，自动生成了一支十五秒的产品概念宣传片。你看，这正好能迁移到你计划做的「腾讯广告素材 AI 自动生成系统」里——不一定所有镜头都要去实拍，利用现成的网页动效代码化和本地工作流串联，试错成本能压到几乎为零。", "第三个利用玩法，是昨天一位苹果电脑重度用户分享的，「利用智能体自带的专属邮箱，搭建一套人在外面走、家里电脑全自动改代码交活的远程流水线」。他是怎么利用的呢？他出门在外的时候，只要脑子里冒出一个新的产品点子或者改版需求，掏出手机给自己的 Grok Bot 智能体发一封指令邮件，智能体收到后就会把拆解好的需求文档自动写进他家里苹果电脑的指定文件夹；而他家里的电脑上开着本地的 Cursor 轮询监听这个文件夹，一旦发现新任务就自动拉起代码库开始编写和测试，如果中间需要生成配图或者图标等美术资源，还会自动调用电脑上的命令行工具去生成图片，全部跑通之后自动提交到 Git 仓库完成交付。换句话说，他利用一个小小的邮箱触发器，把自己在路上的碎片想法，直接变成了家里电脑二十四小时不间断的产出。", "听到这儿，咱们今天早上的四个板块就全部聊完了。最后花半分钟跟你做个小收尾：今天是十月二十七号周二，你清单上排在第一优先级的工作，一个是把公司商城外包评估的现有功能清单、未来规划和缺陷整理出来发给粉象的方山，另一个是继续跟方山推进粉象投放工具的价格、合同和系统开通；副业这边则是抽一个小时检查一下「豆芽声波」分享给家人时的卡片配图和标题。", "这期早间通勤语音简报的文字稿和音频文件我都已经给你生成好存进秘书目录里了。你今天在路上听完之后，有空可以顺手告诉我几件事：第一，咱们刚才提到的第四个板块，也就是「利用…」类的分享，你最希望聚焦在哪些具体方向；第二，今天这期大约十五分钟的时长和男声播报的语速节奏你听着习不习惯，以后是保持十五分钟左右，还是拉长到二十五分钟；第三，每天早上你希望我在几点整准时给你准备好这份简报，比如早上七点四十五、八点整、还是八点半。祝你今天路上顺畅，到了公司推进商城和粉象的事儿一切顺利，咱们明天早上通勤时间接着聊！"]}];

    let speedIndex = 0;

    const audio = document.getElementById('audioPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const seekBar = document.getElementById('seekBar');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const currentTitleEl = document.getElementById('currentTitle');
    const nowPlayingBadge = document.getElementById('nowPlayingBadge');
    const epListEl = document.getElementById('epList');
    const transcriptBox = document.getElementById('transcriptBox');
    const speedBtn = document.getElementById('speedBtn');
    const rewBtn = document.getElementById('rewBtn');
    const fwdBtn = document.getElementById('fwdBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyRssBtn = document.getElementById('copyRssBtn');
    const toast = document.getElementById('toast');

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) return '00:00';
      sec = Math.floor(sec);
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function updateMediaSession(ep) {
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: ep.title,
        artist: 'Smith AI 秘书',
        album: 'Smith 早间通勤 AI 简报',
        artwork: [
          { src: f"https://ssy1oo.github.io/smith-briefing-podcast/cover.png", sizes: '1400x1400', type: 'image/png' }
        ]
      });

      navigator.mediaSession.setActionHandler('play', () => audio.play());
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
      navigator.mediaSession.setActionHandler('seekbackward', (details) => {
        const skip = details.seekOffset || 15;
        audio.currentTime = Math.max(0, audio.currentTime - skip);
      });
      navigator.mediaSession.setActionHandler('seekforward', (details) => {
        const skip = details.seekOffset || 15;
        audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + skip);
      });
      navigator.mediaSession.setActionHandler('seekto', (details) => {
        if (details.fastSeek && 'fastSeek' in audio) {
          audio.fastSeek(details.seekTime);
        } else {
          audio.currentTime = details.seekTime;
        }
      });
      navigator.mediaSession.setActionHandler('previoustrack', () => {
        if (currentIndex > 0) loadEpisode(currentIndex - 1, true);
      });
      navigator.mediaSession.setActionHandler('nexttrack', () => {
        if (currentIndex < EPISODES.length - 1) loadEpisode(currentIndex + 1, true);
      });
    }

    function renderEpisodeList() {
      epListEl.innerHTML = '';
      EPISODES.forEach((ep, idx) => {
        const div = document.createElement('div');
        div.className = 'ep-item' + (idx === currentIndex ? ' active' : '');
        div.innerHTML = `
          <div class="ep-item-top">
            <span>📅 ${ep.date}</span>
            <span>⏱️ ${ep.durationStr} · ${ep.sizeMB}</span>
          </div>
          <div class="ep-item-title">${ep.title}</div>
          <p class="ep-item-summary">${ep.summary}</p>
        `;
        div.addEventListener('click', () => {
          loadEpisode(idx, true);
        });
        epListEl.appendChild(div);
      });
    }

    function loadEpisode(index, autoPlay = false) {
      currentIndex = index;
      const ep = EPISODES[index];
      currentTitleEl.textContent = ep.title;
      nowPlayingBadge.textContent = `正在收听 · ${ep.date}`;
      audio.src = ep.audioUrl;
      audio.playbackRate = SPEEDS[speedIndex];
      downloadBtn.href = ep.audioUrl;
      totalTimeEl.textContent = ep.durationStr;
      seekBar.max = ep.durationSec || 100;

      // Saved progress restore
      const savedPos = localStorage.getItem('briefing_pos_' + ep.date);
      if (savedPos && parseFloat(savedPos) > 5 && parseFloat(savedPos) < (ep.durationSec - 15)) {
        audio.currentTime = parseFloat(savedPos);
      } else {
        audio.currentTime = 0;
      }

      transcriptBox.innerHTML = ep.paragraphs.map(p => `<p>${p}</p>`).join('');
      renderEpisodeList();
      updateMediaSession(ep);

      if (autoPlay) {
        audio.play().catch(err => console.warn('Autoplay prevented:', err));
      }
    }

    playPauseBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => {
      playPauseBtn.textContent = '⏸';
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    });

    audio.addEventListener('pause', () => {
      playPauseBtn.textContent = '▶';
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    });

    audio.addEventListener('loadedmetadata', () => {
      if (audio.duration && isFinite(audio.duration)) {
        seekBar.max = Math.floor(audio.duration);
        totalTimeEl.textContent = formatTime(audio.duration);
      }
    });

    audio.addEventListener('timeupdate', () => {
      seekBar.value = Math.floor(audio.currentTime);
      currentTimeEl.textContent = formatTime(audio.currentTime);
      const ep = EPISODES[currentIndex];
      if (ep && audio.currentTime > 2) {
        localStorage.setItem('briefing_pos_' + ep.date, String(Math.floor(audio.currentTime)));
      }
      if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession && isFinite(audio.duration) && audio.duration > 0) {
        try {
          navigator.mediaSession.setPositionState({
            duration: audio.duration,
            playbackRate: audio.playbackRate,
            position: Math.min(audio.currentTime, audio.duration)
          });
        } catch (e) {}
      }
    });

    audio.addEventListener('ended', () => {
      const ep = EPISODES[currentIndex];
      if (ep) localStorage.removeItem('briefing_pos_' + ep.date);
      if (currentIndex < EPISODES.length - 1) {
        loadEpisode(currentIndex + 1, true);
      }
    });

    seekBar.addEventListener('input', () => {
      audio.currentTime = Number(seekBar.value);
    });

    rewBtn.addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - 15);
    });

    fwdBtn.addEventListener('click', () => {
      audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + 15);
    });

    speedBtn.addEventListener('click', () => {
      speedIndex = (speedIndex + 1) % SPEEDS.length;
      const rate = SPEEDS[speedIndex];
      audio.playbackRate = rate;
      speedBtn.textContent = rate.toFixed(2).replace(/\.00$/, '.0').replace(/0$/, '') + 'x';
    });

    copyRssBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(RSS_URL);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = RSS_URL;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    });

    // Initial load
    if (EPISODES.length > 0) {
      loadEpisode(0, false);
    }
  </script>
</body>
</html>
